<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CodeSakhi Softlaunch</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="https://raw.githubusercontent.com/google/material-design-icons/master/src/material-svg/text_fields/twotone_text_fields/twotone_text_fields_24px.svg" type="image/svg+xml">
</head>
<body>
  <header class="topbar">
    <div class="brand">
        <h1>CodeSakhi Softlaunch</h1>

  </header>

  <main id="boardWrapper">
    <div id="board" class="board"></div>
  </main>
</body>
<script type="module" src="app.js"></script>
</html>
